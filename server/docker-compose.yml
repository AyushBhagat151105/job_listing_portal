version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_listing_api_dev
    # volumes:
      # - .:/app  # Commenting these out so we don't overwrite the built container's /app with host files
      # - /app/node_modules
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: job_listing_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: job_listing_postgres_dev
    environment:
      POSTGRES_USER: aj_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: job_listing_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
